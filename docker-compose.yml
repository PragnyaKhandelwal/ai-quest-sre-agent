services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sre-agent-backend:latest
    container_name: sre-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./agents:/app/agents
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: sre-agent-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
