# Kubernetes deployment manifest -- demonstrates production-grade deployment
# configuration (liveness/readiness probes against the deep GET /health
# check, resource limits, secret-backed env vars). Not the actual deploy
# path for this submission (that's Render + Vercel, see README.md), but a
# real, valid manifest showing how this same image would run on k8s.
#
# Deploy: kubectl apply -f kubernetes/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-backend
  labels:
    app: sre-agent-backend
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-agent-backend
  template:
    metadata:
      labels:
        app: sre-agent-backend
    spec:
      containers:
        - name: sre-agent-backend
          image: ghcr.io/pragnyakhandelwal/sre-agent-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: LYZR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: lyzr-api-key
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: groq-api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sre-agent-secrets
                  key: redis-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent-backend-service
spec:
  selector:
    app: sre-agent-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
