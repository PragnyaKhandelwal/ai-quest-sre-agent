services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sre-agent-backend:latest
    container_name: sre-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sre-agent-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        # Vite bakes this into the JS bundle at build time (see
        # frontend/Dockerfile.frontend) -- override with
        # `docker compose build --build-arg VITE_BACKEND_URL=...` for a
        # non-localhost backend.
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    image: sre-agent-frontend:latest
    container_name: sre-agent-frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this alpine/busybox wget resolves
      # "localhost" to ::1 first and gets refused there even though nginx
      # is correctly listening on 0.0.0.0:80 -- confirmed by hand inside the
      # container (wget http://localhost/health failed, 127.0.0.1 worked).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sre-agent-net

networks:
  sre-agent-net:
    driver: bridge
